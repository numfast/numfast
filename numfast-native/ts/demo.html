<html lang="en">
<meta charset="utf-8">
<title>numfast Q-lookup (wasm)</title>
<pre id="log">loading…</pre>
<script type="module">
import { loadBridge } from "./dist/bridge.js";
const log = (s) => { document.getElementById("log").textContent += "\n" + s; console.log(s); };
const t = async (label, f) => { const t0 = performance.now(); const r = await f(); log(`${label}: ${(performance.now() - t0).toFixed(2)} ms`); return r; };
try {
  const wasm = await t("fetch wasm", async () => (await (await fetch("../target/wasm32-unknown-unknown/release/numfast_native.wasm")).blob()).arrayBuffer());
  const dist = new Uint32Array(await t("fetch dist.bin", async () => (await (await fetch("./artifacts/dist.bin")).blob()).arrayBuffer()));
  const speed = new Uint32Array(await t("fetch speed.bin", async () => (await (await fetch("./artifacts/speed.bin")).blob()).arrayBuffer()));
  const k = new Uint16Array(await t("fetch k.bin", async () => (await (await fetch("./artifacts/k.bin")).blob()).arrayBuffer()));
  const n = dist.length;
  log(`pairs: ${n} (${((dist.byteLength + speed.byteLength + k.byteLength) / 1048576).toFixed(2)} MiB)`);
  const b = await loadBridge(wasm);
  b.reset();
  const dOff = b.put(dist), sOff = b.put(speed), kOff = b.put(k), outOff = b.alloc(n * 4, 8);
  b.ensure(outOff + n * 4);
  for (let i = 0; i < 5; i++) b.costTravelInto(dOff, sOff, kOff, n, outOff);
  const ts = [];
  for (let i = 0; i < 10; i++) { const t0 = performance.now(); b.costTravelInto(dOff, sOff, kOff, n, outOff); ts.push(performance.now() - t0); }
  ts.sort((a, c) => a - c);
  const med = ts[5];
  log(`kernel median: ${med.toFixed(3)} ms`);
  log(`lookup/s: ${Math.round(n / (med / 1000)).toLocaleString("en-US")} (native ctypes baseline: 171,000/s)`);
  b.assertGuard();
  log("guard: OK");
} catch (e) { log("FAIL: " + (e && e.message)); }
</script>
</html>
