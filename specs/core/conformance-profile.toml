# conformance-profile — canonical conformance defaults

# Canonical conformance defaults. Measured device calibration (`nf.calibrate()`)
# lives separately and does not change thresholds — it only records
# `profile_version/source/age` in EXPLAIN (see `04`). The numbers below match
# the inline defaults in `08`, collected in one file.

profile_version = "v0.2.1"
source_spec = "08 (tolerance), 09 (max_dict_entries)"

[tolerance.f32]
# Numeric contract 08: max_abs_diff <= max(atol, rtol*|ref|) OR <= max_ulp ULP.
atol = 1e-5
rtol = 1e-5
max_ulp = 4

[tolerance.f64]
atol = 1e-12
rtol = 1e-12
max_ulp = 2

[dictionary]
# Global-dictionary overflow threshold: above max_dict_entries — 09 FALLBACK
# (abort ingest with an explicit error OR spill dictionary + recompute chunking_plan).
# PROVISIONAL: memory-dependent derivation is an open question.
max_dict_entries = 1048576  # 2^20

[compat]
# CONTRACT exception -- a record of existing behaviour as it is. No code, API or
# behaviour changes here. There is no core portable_core.toml; this file is the
# nearest equivalent. A boundary owned by another project
# (roadgraph/specs/portable_core.toml) is not a core norm.
# See specs/core/00 + 06 (a silent fallback is forbidden), 10 (methodology),
# README.packaging.md + src/Drivers/CPU/_lib/native_cpu.py + src/numfast/_lib/native_env.py.
native = "canonical by default (DLL via NUMFAST_NATIVE_DLL or package-relative _native/)"
disable_flag = "NUMFAST_NATIVE_DISABLE=1 selects the bit-exact Python/NumPy fallback"
fallback_kind = "an explicit compatibility contract for hosts without a DLL, NOT a silent fallback (silent stays forbidden)"
gate_proof = "2M-row max_diff 0, errors 12/12 -- a one-off gated proof with a fixed seed, not a benchmark"
perf_rule = "performance conclusions come only from seed-42 microbenchmarks (see 10); large-volume parity runs are not benchmarks"
