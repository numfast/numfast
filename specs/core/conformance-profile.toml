# conformance-profile — canonical conformance defaults

# Canonical conformance defaults. Measured device calibration (`nf.calibrate()`)
# lives separately and does not change thresholds — it only records
# `profile_version/source/age` in EXPLAIN (see `04`). The numbers below match
# the inline defaults in `08`, collected in one file.

profile_version = "v0.2.1"
source_spec = "08 (tolerance), 09 (max_dict_entries)"

[tolerance.f32]
# Numeric contract 08: max_abs_diff <= max(atol, rtol*|ref|) OR <= max_ulp ULP.
atol = 1e-5
rtol = 1e-5
max_ulp = 4

[tolerance.f64]
atol = 1e-12
rtol = 1e-12
max_ulp = 2

[dictionary]
# Global-dictionary overflow threshold: above max_dict_entries — 09 FALLBACK
# (abort ingest with an explicit error OR spill dictionary + recompute chunking_plan).
# PROVISIONAL: memory-dependent derivation is an open question.
max_dict_entries = 1048576  # 2^20

[compat]
# CONTRACT exception — фиксация существующего поведения как есть (код/API/поведение не меняются).
# Ядерного portable_core.toml нет; ближайший эквивалент — данный файл.
# Чужая граница roadgraph/specs/portable_core.toml нормой ядра не является.
# См. specs/core/00 + 06 (silent fallback запрещён), 10 (методология),
# README.packaging.md + src/Drivers/CPU/_lib/native_cpu.py + src/numfast/_lib/native_env.py.
native = "canonical по умолчанию (DLL via NUMFAST_NATIVE_DLL или package-relative _native/)"
disable_flag = "NUMFAST_NATIVE_DISABLE=1 включает bit-exact Python/NumPy fallback"
fallback_kind = "явный контракт совместимости для сред без DLL, НЕ silent fallback (silent запрещён как раньше)"
gate_proof = "2M-row max_diff 0, errors 12/12 — разовое gate-доказательство с seed, не benchmark"
perf_rule = "perf-выводы только из microbench seed 42 (см. 10); parity-прогоны большого объёма — не benchmarks"
