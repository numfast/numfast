# Publishes @numfast/numfast 1.0.0-alpha.2 via npm Trusted Publisher (OIDC) — no NPM_TOKEN needed
name: Publish npm (OIDC)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm publish --access public --tag alpha --provenance
