[project]
name = "numfast"
version = "0.1.0"
description = "NumFast — GPU-first numerical computing framework"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "framework-builder>=0.1.0",
]
[project.optional-dependencies]
gpu = ["cupy>=13.0"]
cuda = ["cupy>=13.0"]
all = ["numfast[gpu]"]

[tool.setuptools.packages.find]
exclude = [".*", "__pycache__", "*.egg-info", "*.pyc", ".pytest_cache", ".git"]

[project.urls]
Homepage = "https://github.com/numfast/numfast"
Documentation = "https://numfast.readthedocs.io"

[tool.numfast]
loader = "framework_builder.ExtensionsLoader"
root = "."
