[build-system]
# >=77: PEP 639 licence metadata (license / license-files as a PEP 621 string
# + list), which is what puts LICENSE and NOTICE into
# numfast-<v>.dist-info/licenses/ and License-Expression into METADATA.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "numfast"
# Single source of truth for the whole project version. numfast-native/Cargo.toml
# and numfast-native/ts/package.json mirror this value; the JS build refuses to
# run if package.json disagrees (ts/build.mjs:engineVersion).
version = "0.2.1"
description = "NumFast: columnar compute engine for Python (Series/Table + NumPy/Pandas/Arrow adapters)"
# The PyPI long description. README_PYPI.md is the user-facing page written for
# that slot; README.packaging.md is the developer-facing note on what the wheel
# contains and stayed pointed at here until now, so PyPI rendered a build
# recipe as the project description. README_PYPI.md must also be listed in
# MANIFEST.in, or the wheel built from the sdist cannot find it.
readme = "README_PYPI.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

# Without these the PyPI page shows no link back to the source, the
# documentation or the changelog: the project page would be a dead end.
[project.urls]
Homepage = "https://github.com/numfast/numfast"
Repository = "https://github.com/numfast/numfast"
Documentation = "https://github.com/numfast/numfast/blob/main/docs/INSTALL.md"
"API reference" = "https://github.com/numfast/numfast/blob/main/docs/API.md"
Changelog = "https://github.com/numfast/numfast/blob/main/CHANGELOG.md"
"Known limitations" = "https://github.com/numfast/numfast/blob/main/KNOWN_LIMITATIONS.md"
Issues = "https://github.com/numfast/numfast/issues"
"WebAssembly kernels (npm)" = "https://www.npmjs.com/package/@numfast/kernels"

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
arrow = ["pyarrow>=10"]
gpu = ["wgpu>=0.31"]
mem = ["psutil>=5.9"]
test = ["pandas>=1.5", "pyarrow>=10", "pytest", "psutil>=5.9"]

[tool.setuptools]
# Data files are copied by an explicit, flavour-aware step in setup.py, not by
# the sdist file list. Left at its pyproject default (true), include-package-data
# would pull every file MANIFEST.in matches back into the wheel -- including
# src/numfast/_native/numfast_native.dll -- and reintroduce a Windows binary in
# a py3-none-any wheel. MANIFEST.in is the sdist's rule; setup.py is the wheel's.
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["numfast*"]
