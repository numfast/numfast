[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numfast"
version = "0.2.1"
description = "NumFast: packaged GPU-numeric boundary (Series/Table + NumPy/Pandas/Arrow adapters)"
readme = "README.packaging.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
arrow = ["pyarrow>=10"]
gpu = ["wgpu>=0.31"]
mem = ["psutil>=5.9"]
test = ["pandas>=1.5", "pyarrow>=10", "pytest", "psutil>=5.9"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["numfast*"]

[tool.setuptools.package-data]
numfast = ["_native/*.dll", "_native/*.so", "full.toml"]
