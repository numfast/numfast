[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "numfast"
version = "0.0.1"
description = "GPU-first numerical computing framework — Runtime, Driver, Compute, Agent SDK"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
authors = [
    {name = "NumFast", email = "dev@numfast.org"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
keywords = ["gpu", "compute", "numerical", "wgpu", "webgpu", "hpc"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]
[project.optional-dependencies]
gpu = ["wgpu>=0.18"]
all = ["numfast[gpu]"]

[project.urls]
Homepage = "https://github.com/numfast/numfast"
Source = "https://github.com/numfast/numfast"
Documentation = "https://github.com/numfast/numfast"

[tool.numfast]
loader = "framework_builder.ExtensionsLoader"
root = "."
