# NumFast App Manifest
# Builder: python -m builder build .

[kernel]
name = "numfast"
singleton = true

# === Core: inner kitchen ===
[[extensions]]
name = "_main"
path = "src/_main"

[[extensions]]
name = "Storage"
path = "src/core/Storage"

[[extensions]]
name = "Runtime"
path = "src/core/Runtime"

[[extensions]]
name = "Series"
path = "src/core/Series"

[[extensions]]
name = "Pipeline"
path = "src/core/Pipeline"

[[extensions]]
name = "Proxy"
path = "src/core/Proxy"

[[extensions]]
name = "Mods"
path = "src/core/Mods"

[[extensions]]
name = "Tables"
path = "src/core/Tables"

[[extensions]]
name = "Agent"
path = "src/core/Agent"

# === Drivers ===
[[extensions]]
name = "CPU"
path = "src/core/Runtime/_lib/Drivers/CPU"

# === Math: primitives ===
[[extensions]]
name = "Stats"
path = "src/math/Stats"

[[extensions]]
name = "Operations"
path = "src/math/Operations"

[[extensions]]
name = "Compute"
path = "src/math/Compute"
[[extensions]]
name = "AST"
path = "src/math/AST"

[[extensions]]
name = "ISA"
path = "src/math/ISA"


# === Math: primitives ===
[[extensions]]
name = "Math"
path = "src/math/Math"

# === Trading ===
[[extensions]]
name = "Trading"
path = "src/Trading"

# === Visualizer ===
[[extensions]]
name = "Vis"
path = "src/Vis"
