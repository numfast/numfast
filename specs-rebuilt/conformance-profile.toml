# conformance-profile — canonical conformance defaults

# Canonical conformance defaults. Measured device calibration (`nf.calibrate()`)
# lives separately and does not change thresholds — it only records
# `profile_version/source/age` in EXPLAIN (see `04`). The numbers below match
# the inline defaults in `08`, collected in one file.

profile_version = "v0.2.1"
source_spec = "08 (tolerance), 09 (max_dict_entries)"

[tolerance.f32]
# Numeric contract 08: max_abs_diff <= max(atol, rtol*|ref|) OR <= max_ulp ULP.
atol = 1e-5
rtol = 1e-5
max_ulp = 4

[tolerance.f64]
atol = 1e-12
rtol = 1e-12
max_ulp = 2

[dictionary]
# Global-dictionary overflow threshold: above max_dict_entries — 09 FALLBACK
# (abort ingest with an explicit error OR spill dictionary + recompute chunking_plan).
# PROVISIONAL: memory-dependent derivation is an open question.
max_dict_entries = 1048576  # 2^20
